plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.mozilla.rust-android-gradle.rust-android'
}
android {
    namespace 'org.mywubi'
    compileSdk 35
    buildToolsVersion '35.0.0'
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'org.mywubi'
        minSdk 26
        targetSdk 35
        versionCode providers.gradleProperty('versionCode').getOrElse('2').toInteger()
        versionName '0.4.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }
    buildFeatures { compose true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    def signingValues = ['MYWUBI_KEYSTORE', 'MYWUBI_STORE_PASSWORD', 'MYWUBI_KEY_ALIAS', 'MYWUBI_KEY_PASSWORD'].collect { System.getenv(it) }
    if (signingValues.any { it } && !signingValues.every { it }) throw new GradleException('Release signing requires all four MYWUBI signing environment variables')
    signingConfigs {
        if (signingValues.every { it }) {
            release {
                storeFile file(signingValues[0])
                storePassword signingValues[1]
                keyAlias signingValues[2]
                keyPassword signingValues[3]
            }
        }
    }
    buildTypes {
        release { if (signingValues.every { it }) signingConfig signingConfigs.release }
    }
    sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/assets')
}
cargo {
    module = '../native'
    targetDirectory = '../../target'
    libname = 'mywubi_android'
    targets = ['arm64', 'x86_64']
    apiLevel = 26
    profile = 'release'
    extraCargoBuildArguments = ['--locked']
}
tasks.register('prepareTables', Copy) {
    from('../../tables') { include 'wubi86.dict', 'pinyin.dict', 'english.dict' }
    into layout.buildDirectory.dir('generated/assets/tables')
}
tasks.register('prepareProtocolFixtures', Copy) {
    from('../../core_engine/tests/fixtures/protocol')
    into layout.buildDirectory.dir('generated/assets/protocol')
}
tasks.register('prepareLicenses', Copy) {
    from('../../tables/licenses')
    from('../../tables') { include 'README.md', 'sources.json' }
    into layout.buildDirectory.dir('generated/assets/licenses')
}
tasks.register('verifyRustVersion') {
    doLast {
        def version = providers.exec { commandLine 'rustc', '--version' }.standardOutput.asText.get()
        if (!version.startsWith('rustc 1.99.1 ')) throw new GradleException('Android 构建固定 Rust 1.99.1；请用 rustup 选择该工具链')
    }
}
tasks.configureEach { task ->
    if (task.name.startsWith('cargoBuild')) task.dependsOn 'verifyRustVersion'
    if (task.name == 'preBuild') task.dependsOn 'cargoBuild', 'prepareTables', 'prepareProtocolFixtures', 'prepareLicenses'
    if (task.name.startsWith('merge') && task.name.endsWith('JniLibFolders')) task.dependsOn 'cargoBuild'
    if (task.name == 'assembleDebug') task.doLast {
        def apk = layout.buildDirectory.file('outputs/apk/debug/app-debug.apk').get().asFile
        new java.util.zip.ZipFile(apk).withCloseable { zip ->
            ['arm64-v8a', 'x86_64'].each { abi ->
                if (zip.getEntry("lib/${abi}/libmywubi_android.so") == null)
                    throw new GradleException("APK 缺少 ${abi} 原生库")
            }
        }
    }
}
dependencies {
    implementation platform('androidx.compose:compose-bom:2024.09.03')
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.6'
    implementation 'androidx.savedstate:savedstate-ktx:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
    testImplementation 'junit:junit:4.13.2'
}

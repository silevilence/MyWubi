[package]
name = "mywubi_android"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
core_engine = { path = "../../core_engine" }
jni = "0.21.1"
model_input = { version = "0.8.0", path = "../../model_input" }

[features]
llama = ["model_input/llama-cpp-2", "model_input/android-static-stdcxx"]
onnx = ["model_input/ort"]

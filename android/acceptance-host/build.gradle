plugins { id 'com.android.application' }
android {
    sourceSets.main.assets.srcDir(rootProject.file("tests"))
    namespace 'org.mywubi.acceptancehost'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'org.mywubi.acceptancehost'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1'
    }
}

// Reuse the shipped skin fixture for cross-application file handoff tests.
def skinFixture = tasks.register('prepareSkinFixture', Copy) {
    from('../../examples/skins') { include 'bamboo-android.mywubi-skin' }
    into layout.buildDirectory.dir('generated/skin-fixture')
}
android.sourceSets.main.assets.srcDir(skinFixture)

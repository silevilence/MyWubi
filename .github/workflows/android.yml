name: Android validation
on:
  workflow_dispatch:
  push:
    paths: ['android/**', 'core_engine/**', 'Cargo.*', '.cargo/**', 'tables/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'core_engine/**', 'Cargo.*', '.cargo/**', 'tables/**', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
          targets: aarch64-linux-android,x86_64-linux-android
          components: rustfmt,clippy
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install fixed Android build dependencies
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
      - name: Core and native protocol
        run: |
          cargo fmt --all -- --check
          cargo test -p core_engine -p mywubi_android --locked
          cargo clippy -p core_engine -p mywubi_android --all-targets --locked -- -D warnings
      - name: Build APKs and lint
        working-directory: android
        run: bash gradlew :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease :app:lintDebug --console=plain
      - name: Inspect both ABI payloads and ELF/ZIP alignment
        run: |
          python android/check_apk.py android/app/build/outputs/apk/debug/app-debug.apk --output android/app/build/outputs/debug-native-report.json
          python android/check_apk.py android/app/build/outputs/apk/release/app-release-unsigned.apk --output android/app/build/outputs/release-native-report.json
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 android/app/build/outputs/apk/debug/app-debug.apk
      - name: Allow emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Device protocol and resource contracts
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: cd android && bash gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=org.mywubi.NativeContractTest,org.mywubi.EditorContractTest,org.mywubi.LifecycleContractTest,org.mywubi.ResourceContractTest,org.mywubi.LibraryContractTest,org.mywubi.LibraryModelTest --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-apks-and-evidence
          path: |
            android/app/build/outputs/apk/
            android/app/build/outputs/*-native-report.json
            android/app/build/reports/
            tables/licenses/
            tables/sources.json

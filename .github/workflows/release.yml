name: 🚀 Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable release tag
        required: true
        type: string
      scope:
        description: Platforms to deliver
        required: true
        type: choice
        options: [both, windows, android]

run-name: Release ${{ inputs.tag }} (${{ inputs.scope }})

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RELEASE_TAG: ${{ inputs.tag }}
  RELEASE_SCOPE: ${{ inputs.scope }}

jobs:
  metadata:
    name: Validate release version and notes
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      commit: ${{ steps.meta.outputs.commit }}
    steps:
      - name: Check dispatch and tag
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          [[ "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" ]]
          [[ "$RELEASE_TAG" =~ ^[vV][0-9]+[.][0-9]+[.][0-9]+$ ]]
          [[ "$RELEASE_SCOPE" =~ ^(windows|android|both)$ ]]
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m unittest discover -s scripts -p 'test_*.py' -v
          python scripts/publish_release.py prepare
      - uses: actions/upload-artifact@v4
        with:
          name: release-metadata
          path: release-metadata/
          if-no-files-found: error

  windows:
    if: inputs.scope == 'both' || inputs.scope == 'windows'
    name: Windows packages
    needs: metadata
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.commit }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install Velopack
        run: dotnet tool install -g vpk --version 1.2.0
      - name: Test workspace
        run: cargo test --workspace --locked
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare pinned ONNX runtime
        run: python -m pip install onnxruntime==1.31.1
      - name: Build unified Windows application and CPU components
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          $ort = python -c "import pathlib,onnxruntime; print(pathlib.Path(onnxruntime.__file__).parent/'capi'/'onnxruntime.dll')"
          ./build.ps1 -Version $env:RELEASE_VERSION -ReleaseTag $env:RELEASE_TAG -OnnxRuntime $ort
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            Releases/*-Setup.exe
            Releases/*-Portable.zip
            Releases/*.nupkg
            Releases/releases.*.json
            Releases/MyWubi-components-*.zip
            Releases/components.json
          if-no-files-found: error

  android:
    if: inputs.scope == 'both' || inputs.scope == 'android'
    name: Signed Android APK
    needs: metadata
    runs-on: ubuntu-24.04
    env:
      MYWUBI_KEYSTORE_BASE64: ${{ secrets.MYWUBI_KEYSTORE_BASE64 }}
      MYWUBI_STORE_PASSWORD: ${{ secrets.MYWUBI_STORE_PASSWORD }}
      MYWUBI_KEY_ALIAS: ${{ secrets.MYWUBI_KEY_ALIAS }}
      MYWUBI_KEY_PASSWORD: ${{ secrets.MYWUBI_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.commit }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle
            android/gradle/wrapper/gradle-wrapper.properties
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
          targets: aarch64-linux-android,x86_64-linux-android
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install fixed SDK and NDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
      - name: Configure native model toolchain
        run: |
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_API_LEVEL=26" >> "$GITHUB_ENV"
          echo "CMAKE_GENERATOR=Ninja" >> "$GITHUB_ENV"
          for arch in aarch64 x86_64; do
            for flags in CFLAGS CXXFLAGS; do
              echo "${flags}_${arch}_linux_android=--target=${arch}-linux-android26" >> "$GITHUB_ENV"
            done
          done
      - name: Restore release signing key
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          for name in ('MYWUBI_KEYSTORE_BASE64', 'MYWUBI_STORE_PASSWORD', 'MYWUBI_KEY_ALIAS', 'MYWUBI_KEY_PASSWORD'):
              if not os.environ.get(name):
                  raise SystemExit(f'Missing signing secret: {name}')
          key = Path(os.environ['RUNNER_TEMP']) / 'mywubi-release.jks'
          key.write_bytes(base64.b64decode(os.environ['MYWUBI_KEYSTORE_BASE64'], validate=True))
          key.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'MYWUBI_KEYSTORE={key}\n')
          PY
      - name: Core and native checks
        run: |
          cargo fmt --all -- --check
          cargo test -p core_engine -p mywubi_android --locked
          cargo clippy -p core_engine -p mywubi_android --all-targets --locked -- -D warnings
      - name: Build signed release APK
        working-directory: android
        run: bash gradlew :app:assembleRelease :app:testReleaseUnitTest :app:lintRelease --console=plain
      - name: Verify signature, ABIs and alignment
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 "$apk"
          mkdir -p android-release
          cp "$apk" "android-release/MyWubi-$RELEASE_VERSION-Android.apk"
          python android/check_apk.py "android-release/MyWubi-$RELEASE_VERSION-Android.apk" --output "android-release/MyWubi-$RELEASE_VERSION-Android-native.json"
          python scripts/check_model_artifacts.py --optional-onnx --apk "$apk"
      - name: Build and verify same-signature full runtime fallback
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          bash android/gradlew -p android -PbundleOnnx=true :app:assembleRelease --console=plain
          apk="android-release/MyWubi-$RELEASE_VERSION-Android-full.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 "$apk"
          python android/check_apk.py "$apk" --output "android-release/MyWubi-$RELEASE_VERSION-Android-full-native.json"
          python scripts/check_model_artifacts.py --apk "$apk"
      - uses: actions/download-artifact@v4
        with:
          name: release-metadata
          path: release-metadata/
      - name: Generate Android update manifest from signed APK
        env:
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          for variant in standard full; do
            suffix=""; flags=()
            if [[ "$variant" == full ]]; then suffix=-full; flags=(--full); fi
            python scripts/android_update_metadata.py "${flags[@]}" \
              --apk "android-release/MyWubi-${RELEASE_TAG:1}-Android$suffix.apk" \
              --aapt "$ANDROID_HOME/build-tools/35.0.0/aapt" --tag "$RELEASE_TAG" \
              --notes release-metadata/release-notes.md --output "android-release/android-update$suffix.json"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: android-release/
          if-no-files-found: error

  publish:
    name: Publish selected platforms
    needs: [metadata, windows, android]
    if: >-
      always() && !cancelled() && needs.metadata.result == 'success' &&
      needs.windows.result == ((inputs.scope == 'android' && 'skipped') || 'success') &&
      needs.android.result == ((inputs.scope == 'windows' && 'skipped') || 'success')
    concurrency:
      group: publish-stable-release
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.commit }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: artifacts
      - name: Verify artifacts, resume matching draft and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_release.py publish

name: 🚀 Release

on:
  push:
    tags: ['v*.*.*', 'V*.*.*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  metadata:
    name: Validate release version and notes
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: meta
        run: |
          python -m unittest discover -s scripts -p 'test_*.py' -v
          python scripts/release_metadata.py
      - uses: actions/upload-artifact@v4
        with:
          name: release-metadata
          path: release-metadata/
          if-no-files-found: error

  windows:
    name: Windows packages
    needs: metadata
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install Velopack
        run: dotnet tool install -g vpk --version 1.2.0
      - name: Test workspace
        run: cargo test --workspace --locked
      - name: Build Windows binaries
        run: cargo build --release --locked -p settings -p im_engine
      - name: Package Windows
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: ./build.ps1 -Version $env:RELEASE_VERSION -SkipBuild
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            Releases/*-Setup.exe
            Releases/*-Portable.zip
            Releases/*.nupkg
            Releases/releases.*.json
          if-no-files-found: error

  android:
    name: Signed Android APK
    needs: metadata
    runs-on: ubuntu-24.04
    env:
      MYWUBI_KEYSTORE_BASE64: ${{ secrets.MYWUBI_KEYSTORE_BASE64 }}
      MYWUBI_STORE_PASSWORD: ${{ secrets.MYWUBI_STORE_PASSWORD }}
      MYWUBI_KEY_ALIAS: ${{ secrets.MYWUBI_KEY_ALIAS }}
      MYWUBI_KEY_PASSWORD: ${{ secrets.MYWUBI_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle
            android/gradle/wrapper/gradle-wrapper.properties
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
          targets: aarch64-linux-android,x86_64-linux-android
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - uses: android-actions/setup-android@v3
      - name: Install fixed SDK and NDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
      - name: Restore release signing key
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          for name in ('MYWUBI_KEYSTORE_BASE64', 'MYWUBI_STORE_PASSWORD', 'MYWUBI_KEY_ALIAS', 'MYWUBI_KEY_PASSWORD'):
              if not os.environ.get(name):
                  raise SystemExit(f'Missing signing secret: {name}')
          key = Path(os.environ['RUNNER_TEMP']) / 'mywubi-release.jks'
          key.write_bytes(base64.b64decode(os.environ['MYWUBI_KEYSTORE_BASE64'], validate=True))
          key.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'MYWUBI_KEYSTORE={key}\n')
          PY
      - name: Core and native checks
        run: |
          cargo fmt --all -- --check
          cargo test -p core_engine -p mywubi_android --locked
          cargo clippy -p core_engine -p mywubi_android --all-targets --locked -- -D warnings
      - name: Build signed release APK
        working-directory: android
        run: bash gradlew :app:assembleRelease :app:testReleaseUnitTest :app:lintRelease --console=plain
      - name: Verify signature, ABIs and alignment
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 "$apk"
          mkdir -p android-release
          cp "$apk" "android-release/MyWubi-$RELEASE_VERSION-Android.apk"
          python android/check_apk.py "android-release/MyWubi-$RELEASE_VERSION-Android.apk" --output "android-release/MyWubi-$RELEASE_VERSION-Android-native.json"
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: android-release/
          if-no-files-found: error

  publish:
    name: Publish both platforms
    if: startsWith(github.ref, 'refs/tags/')
    needs: [metadata, windows, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: artifacts
      - name: Check complete asset set and generate checksums
        run: |
          python - <<'PY'
          import hashlib, shutil
          from pathlib import Path
          windows = Path('artifacts/release-windows')
          android = Path('artifacts/release-android')
          for root, pattern in ((windows, '*-Setup.exe'), (windows, '*-Portable.zip'), (windows, '*.nupkg'), (windows, 'releases.*.json'), (android, '*.apk')):
              if not list(root.glob(pattern)):
                  raise SystemExit(f'Missing release assets: {pattern}')
          destination = Path('dist')
          destination.mkdir()
          for root in (windows, android):
              for asset in root.iterdir():
                  if not asset.is_file() or (destination / asset.name).exists():
                      raise SystemExit(f'Unexpected/duplicate asset: {asset}')
                  shutil.copy2(asset, destination / asset.name)
          checksums = [f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}' for p in sorted(destination.iterdir())]
          (destination / 'SHA256SUMS.txt').write_text('\n'.join(checksums) + '\n')
          PY
      - name: Upload all assets to a draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          name: MyWubi ${{ needs.metadata.outputs.version }}
          body_path: artifacts/release-metadata/release-notes.md
          draft: true
          fail_on_unmatched_files: true
          files: dist/*
      - name: Publish completed release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest

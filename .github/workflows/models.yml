name: Optional CPU model artifacts
on:
  workflow_dispatch:
  pull_request:
    paths: ['Cargo.*', 'core_engine/**', 'model_input/**', 'windows/**', 'android/**', 'build.ps1', 'scripts/check_model_artifacts.py', 'scripts/stage_model_runtime.ps1', '.github/workflows/models.yml']
permissions:
  contents: read
jobs:
  native-payloads:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install fixed runtime and NDK
        shell: pwsh
        run: |
          python -m pip install onnxruntime==1.31.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
      - name: Windows backends and lifecycle tests
        shell: pwsh
        run: |
          $ort = python -c "import pathlib,onnxruntime; print(pathlib.Path(onnxruntime.__file__).parent/'capi'/'onnxruntime.dll')"
          ./model_input/build.ps1 -OnnxRuntime $ort -Test
          python scripts/check_model_artifacts.py
      - name: Android optional model APK and unit tests
        shell: pwsh
        run: ./android/build-models.ps1 -Sdk $env:ANDROID_HOME
      - name: Inspect payloads and 16 KiB alignment
        shell: pwsh
        run: |
          python android/check_apk.py android/app/build/outputs/apk/debug/app-debug.apk --output android/app/build/outputs/model-native-report.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check_model_artifacts.py --apk android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: optional-model-validation
          path: |
            android/app/build/outputs/apk/
            android/app/build/outputs/model-native-report.json
            model_input/licenses/
          if-no-files-found: error
# This validates build artifacts only. It does not publish a recommended model,
# execute the ignored licensed-GGUF test, or substitute for ARM64 device testing.

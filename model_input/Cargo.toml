[package]
name = "model_input"
version.workspace = true
edition.workspace = true
license.workspace = true
autobins = false

[dependencies]
core_engine = { path = "../core_engine" }
llama-cpp-2 = { version = "=0.1.161", default-features = false, optional = true }
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "api-31"], optional = true }
self_cell = { version = "1", optional = true }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
thiserror.workspace = true

[features]
llama-cpp-2 = ["dep:llama-cpp-2", "dep:self_cell"]
ort = ["dep:ort"]

[[bin]]
name = "evaluate"
path = "src/bin/evaluate.rs"

[[bin]]
name = "model_packages"
path = "src/bin/model_packages.rs"

[[bin]]
name = "score-llama"
path = "src/bin/score_llama.rs"
required-features = ["llama-cpp-2"]

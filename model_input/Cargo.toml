[package]
name = "model_input"
version.workspace = true
edition.workspace = true
license.workspace = true
autobins = false

[dependencies]
core_engine = { path = "../core_engine" }
fs2 = "0.4"
llama-cpp-2 = { version = "=0.1.161", default-features = false, optional = true }
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "api-31"], optional = true }
runtime_components = { version = "0.8.0", path = "../windows/runtime_components" }
self_cell = { version = "1", optional = true }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
thiserror.workspace = true
ureq = { version = "3.5.1", default-features = false, features = ["rustls"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[features]
llama-cpp-2 = ["dep:llama-cpp-2", "dep:self_cell"]
ort = ["dep:ort"]
vulkan = ["llama-cpp-2", "llama-cpp-2/vulkan"]
cuda = ["llama-cpp-2", "llama-cpp-2/cuda"]
android-static-stdcxx = ["llama-cpp-2/android-static-stdcxx"]

[[bin]]
name = "download-model"
path = "src/bin/download_model.rs"

[[bin]]
name = "evaluate"
path = "src/bin/evaluate.rs"

[[bin]]
name = "prediction-replay"
path = "src/bin/prediction_replay.rs"

[[bin]]
name = "model-worker"
path = "src/bin/model_worker.rs"

[[bin]]
name = "probe-pipeline"
path = "src/bin/probe_pipeline.rs"

[[bin]]
name = "probe-device"
path = "src/bin/probe_device.rs"

[[bin]]
name = "probe-preload"
path = "src/bin/probe_preload.rs"

[[bin]]
name = "probe-service"
path = "src/bin/probe_service.rs"

[[bin]]
name = "model_packages"
path = "src/bin/model_packages.rs"

[[bin]]
name = "evaluate-generation"
path = "src/bin/evaluate_generation.rs"
required-features = ["llama-cpp-2"]

[[bin]]
name = "generate-words"
path = "src/bin/generate_words.rs"
required-features = ["llama-cpp-2"]

[[bin]]
name = "score-llama"
path = "src/bin/score_llama.rs"
required-features = ["llama-cpp-2"]

[[bin]]
name = "compare-models"
path = "src/bin/compare_models.rs"
required-features = ["llama-cpp-2", "ort"]

[target."cfg(windows)".dependencies]
model_ipc = { version = "0.8.0", path = "../windows/model_ipc" }

[dev-dependencies]
tempfile = "3.27.0"
